<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ninja Training</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
      .injured { color: #b50000; font-weight: bold; }
      button { margin-top: 10px; padding: 8px 12px; }
      pre { background: #f5f5f5; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Weekly Training Assignment</h1>
    <div class="grid">
      <div class="card">
        <h2>Assignments</h2>
        <div id="ninjaList"></div>
        <button id="confirmBtn">Confirm Weekly Training</button>
      </div>
      <div class="card">
        <h2>Projected Gains Preview</h2>
        <div id="preview"></div>
      </div>
    </div>

    <h2>Training Result Report</h2>
    <pre id="report">No training run yet.</pre>

    <script src="trainingSystem.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
